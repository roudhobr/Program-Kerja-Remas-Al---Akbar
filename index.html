<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program Kerja Remas Al-Akbar 2026/2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b3a;--teal:#0e9aab;--teal-d:#0a7886;--mint:#dff4f6;--paper:#f6fafb;--ink:#14213d;--mut:#5b6b82;--line:#d8e4e8;
--c-bph:#0e9aab;--c-dd:#e8793a;--c-ek:#7a5af8;--c-oe:#2e9e5b}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--paper)}
html,body{min-height:100%;overflow-x:clip}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.1}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:var(--teal);z-index:50;transition:width .1s}
.hero{background:var(--navy);color:#fff;padding:88px 6vw 110px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;border:2px solid rgba(14,154,171,.35);animation:spin 40s linear infinite}
.hero:before{width:520px;height:520px;right:-120px;top:-140px;border-top-color:transparent}
.hero:after{width:340px;height:340px;right:60px;bottom:-170px;border-right-color:transparent;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero small{display:block;color:#8fd8e1;font-weight:600;margin-bottom:18px;opacity:0;animation:fade .8s .1s forwards}
.hero h1{font-size:clamp(46px,10vw,118px);font-weight:800;letter-spacing:-.03em;max-width:900px}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(60%) rotate(6deg);animation:pop .7s cubic-bezier(.2,.9,.3,1.2) forwards}
.hero h1 .t{color:var(--teal)}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.hero p{max-width:540px;margin-top:22px;color:#c4d3e6;opacity:0;animation:fade .8s 1.1s forwards}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px;opacity:0;animation:fade .8s 1.4s forwards}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 20px;min-width:110px}
.stat b{font:800 30px 'Bricolage Grotesque';display:block}
.stat em{font-style:normal;font-size:13px;color:#a9bcd3}
.wrap{max-width:1120px;margin:-52px auto 70px;padding:0 5vw;position:relative}
.panel{background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(13,27,58,.12);padding:16px}
.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;border:0;background:none;font:600 15px 'Plus Jakarta Sans';padding:12px 18px;border-radius:12px;color:var(--mut);cursor:pointer;position:relative;z-index:1;transition:color .25s;white-space:nowrap}
.tab.on{color:#fff}.tab i{font-style:normal;opacity:.7;margin-left:6px;font-size:13px}
.pill{position:absolute;top:0;left:0;height:100%;border-radius:12px;background:var(--navy);transition:transform .45s cubic-bezier(.3,1.2,.4,1),width .45s cubic-bezier(.3,1.2,.4,1)}
.search{margin-top:12px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px var(--mint)}
.search input{flex:1;border:0;outline:0;font:500 15px 'Plus Jakarta Sans';padding:13px 0;background:none}
.intro{margin:34px 4px 18px;max-width:620px;min-height:52px;color:var(--mut);transition:opacity .25s}
.intro h2{color:var(--ink);font-size:30px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:18px;align-items:start}
.card{background:#fff;border-radius:18px;border:1px solid var(--line);padding:20px 20px 16px;cursor:pointer;position:relative;overflow:hidden;
 border-left:6px solid var(--c);animation:in .5s cubic-bezier(.2,.8,.3,1) both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(13,27,58,.1)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
.card .dv{font-size:12.5px;font-weight:600;color:var(--c);margin-bottom:6px}
.card h3{font-size:21px;font-weight:700;margin-bottom:8px;padding-right:30px}
.card p.s{font-size:14.5px;color:var(--mut)}
.chev{position:absolute;right:16px;top:18px;width:26px;height:26px;border-radius:50%;background:var(--mint);display:grid;place-items:center;transition:transform .4s,background .3s}
.chev:after{content:"";width:7px;height:7px;border:solid var(--teal-d);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.card.open .chev{transform:rotate(180deg);background:var(--c)}.card.open .chev:after{border-color:#fff}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,.9,.3,1)}
.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.row{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14.5px;opacity:0;transform:translateY(8px);transition:.4s}
.card.open .row{opacity:1;transform:none}.card.open .row:nth-child(2){transition-delay:.08s}.card.open .row:nth-child(3){transition-delay:.16s}.card.open .row:nth-child(4){transition-delay:.24s}
.row b{display:block;font-size:13px;color:var(--c);margin-bottom:2px}
.time{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;background:var(--mint);color:var(--teal-d);padding:5px 12px;border-radius:99px}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--mut)}
footer{text-align:center;padding:30px 5vw 50px;margin-top:0;color:var(--mut);font-size:14px}
#top{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:20px;cursor:pointer;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
#top.show{transform:scale(1)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

/* ===== Mobile ===== */
@media(max-width:820px){
 .hero{padding:64px 6vw 96px}
 .hero:before{width:360px;height:360px;right:-160px;top:-120px}
 .hero:after{display:none}
}
@media(max-width:600px){
 .hero{padding:48px 20px 84px}
 .hero small{font-size:13px;margin-bottom:14px}
 .hero h1{font-size:clamp(38px,12.5vw,56px);letter-spacing:-.025em}
 .hero p{font-size:15px;margin-top:16px}
 .stats{gap:10px;margin-top:24px}
 .stat{flex:1;min-width:0;padding:10px 14px}
 .stat b{font-size:26px}
 .wrap{padding:0 14px;margin:-44px auto 48px}
 .panel{padding:10px;border-radius:16px;position:sticky;top:8px;z-index:20}
 .tabs{margin:0 -2px;padding-bottom:2px;scroll-snap-type:x proximity}
 .tab{padding:11px 14px;font-size:14px;min-height:44px;scroll-snap-align:center}
 .search{margin-top:8px}
 .search input{font-size:16px;padding:12px 0}
 .intro{margin:24px 2px 14px}
 .intro h2{font-size:24px}
 .grid{gap:14px}
 .card{padding:16px 16px 14px;border-radius:16px;border-left-width:5px}
 .card:hover{transform:none;box-shadow:none}
 .card:active{transform:scale(.985)}
 .card h3{font-size:19px}
 .card p.s{font-size:14px}
 .chev{width:32px;height:32px;right:12px;top:12px}
 .row{font-size:14px}
 .time{font-size:12.5px;max-width:100%}
 footer{padding:0 20px calc(40px + env(safe-area-inset-bottom))}
 #top{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:44px;height:44px}
}
@media(max-width:360px){
 .stats{flex-direction:column}
 .tab i{display:none}
}
@media(hover:none){.card:hover{transform:none;box-shadow:none}}
</style>
</head>
<body>
<div id="bar"></div>
<header class="hero">
  <small>Remaja Masjid Al-Akbar Surabaya · Periode 2026/2027</small>
  <h1 id="ttl">Program kerja yang <span class="t">menghidupkan</span> masjid</h1>
  <p>Semua rencana kegiatan dari empat divisi, dalam satu halaman. Ketuk kartu untuk melihat tujuan, sasaran, dan waktunya.</p>
  <div class="stats">
    <div class="stat"><b data-n="0" id="s-prog">0</b><em>Program kerja</em></div>
    <div class="stat"><b data-n="0" id="s-div">0</b><em>Divisi</em></div>
  </div>
</header>

<main class="wrap">
  <div class="panel">
    <div class="tabs" id="tabs"><div class="pill" id="pill"></div></div>
    <label class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="Cari program, misalnya Subuh atau soccer" autocomplete="off"></label>
  </div>
  <div class="intro" id="intro"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<footer>Pengurus Remaja Masjid Al-Akbar Surabaya · remas@alakbar.or.id</footer>
<button id="top" aria-label="Kembali ke atas">↑</button>

<script>
const DATA = {
 "divisi": [
  {
   "id": "bph",
   "nama": "Badan Pengurus Harian",
   "ket": "Perekrutan kader dan konsolidasi remaja masjid se-Jawa Timur."
  },
  {
   "id": "dd",
   "nama": "Dakwah & Digital",
   "ket": "Syiar Islam lewat kajian, majelis, dan konten digital kekinian."
  },
  {
   "id": "ek",
   "nama": "Event & Kerja Sama",
   "ket": "Event besar, PHBI, dan kemitraan strategis."
  },
  {
   "id": "oe",
   "nama": "Olahraga & Entrepreneurship",
   "ket": "Kebugaran kader dan jiwa wirausaha mandiri."
  }
 ],
 "program": [
  {
   "d": "bph",
   "n": "Open Recruitment",
   "desk": "Perekrutan anggota baru langsung (door to door) ke sekolah-sekolah, dengan fasilitas keanggotaan seperti E-ID Card, seragam, dan program peningkatan skill.",
   "tujuan": "Menjaring kader baru generasi muda, memperluas keanggotaan, dan membekali anggota baru dengan fasilitas serta keterampilan yang dibutuhkan.",
   "sasaran": "Siswa SMP/SMA sederajat, target 50 sekolah",
   "waktu": "Belum ditentukan"
  },
  {
   "d": "bph",
   "n": "Al-Akbar Memanggil",
   "desk": "Kegiatan Mosque Youth Movement berupa ajang berkumpul dan berjejaring bagi seluruh pemuda Remaja Masjid (REMAS) se-Jawa Timur.",
   "tujuan": "Mengajak, mengonsolidasikan, dan mempererat hubungan serta pergerakan pemuda remaja masjid lintas daerah di Jawa Timur.",
   "sasaran": "Seluruh pemuda REMAS se-Jawa Timur",
   "waktu": "2 hari (Hari 1 pembukaan & kemasjidan, Hari 2 penguatan organisasi & malam puncak)"
  },
  {
   "d": "dd",
   "n": "Majelis Shubuh GenZi",
   "desk": "Kajian keislaman setelah shalat Subuh dengan narasumber yang berganti setiap bulan.",
   "tujuan": "Wadah bagi generasi muda meningkatkan pemahaman keislaman dan membangun kebiasaan mengikuti kajian selepas Subuh.",
   "sasaran": "Generasi muda / Gen Z (minimal 1.000 peserta)",
   "waktu": "1 bulan sekali"
  },
  {
   "d": "dd",
   "n": "GenZi Night Spectacular",
   "desk": "Diskusi dan sharing interaktif dengan mengangkat isu yang relevan dengan kehidupan anak muda.",
   "tujuan": "Wadah memperoleh wawasan, bertukar perspektif, dan membahas isu yang dekat dengan keseharian.",
   "sasaran": "Generasi muda / Gen Z (minimal 100 orang)",
   "waktu": "2 bulan sekali"
  },
  {
   "d": "dd",
   "n": "Majelis Sholawat Al-Akbar",
   "desk": "Majelis sholawat dan pembacaan Diba’an secara rutin.",
   "tujuan": "Wadah bagi jamaah, khususnya generasi muda, meningkatkan kecintaan kepada Rasulullah SAW dan memperkuat ukhuwah.",
   "sasaran": "Jamaah dan generasi muda",
   "waktu": "2 minggu sekali, setiap Kamis malam"
  },
  {
   "d": "dd",
   "n": "Tahsin Al-Qur’an",
   "desk": "Pelaksanaan tahsin Al-Qur’an secara bersama-sama.",
   "tujuan": "Meningkatkan kemampuan dan ketepatan membaca Al-Qur’an sesuai kaidah tajwid.",
   "sasaran": "STAI dan peserta umum (pendaftaran online)",
   "waktu": "Setiap Rabu, ba’da Isya"
  },
  {
   "d": "dd",
   "n": "Islamic StoryFest",
   "desk": "Lomba Islamic storytelling.",
   "tujuan": "Mengenalkan nilai-nilai keislaman melalui storytelling yang menarik dan sesuai usia anak.",
   "sasaran": "Siswa SD – SMP",
   "waktu": "1 Muharram"
  },
  {
   "d": "dd",
   "n": "Lomba Konten Hari Santri",
   "desk": "Lomba pembuatan konten bertema Masjid Al-Akbar untuk memperingati Hari Santri.",
   "tujuan": "Mendorong kreativitas membuat konten positif sekaligus memperkenalkan Masjid Al-Akbar lewat media digital.",
   "sasaran": "Umum",
   "waktu": "Hari Santri"
  },
  {
   "d": "dd",
   "n": "Engagement Care",
   "desk": "Pembuatan dan publikasi story interaktif di media sosial.",
   "tujuan": "Meningkatkan interaksi dan keterlibatan audiens dengan media sosial Al-Akbar.",
   "sasaran": "Pengikut media sosial Al-Akbar",
   "waktu": "2 kali sebulan (minggu pertama dan minggu terakhir)"
  },
  {
   "d": "dd",
   "n": "Clipper MSG",
   "desk": "Mengambil potongan momen menarik dari live MSG, lalu mengolahnya menjadi video pendek.",
   "tujuan": "Menghasilkan konten singkat yang informatif dan menarik dari MSG untuk meningkatkan engagement.",
   "sasaran": "Pengikut media sosial Al-Akbar",
   "waktu": "1 kali per bulan / 2 bulan sekali (H+7 MSG)"
  },
  {
   "d": "ek",
   "n": "Volunteer Ramadhan 1448 H",
   "desk": "Kegiatan sosial yang mengajak para volunteer.",
   "tujuan": "Membantu pelaksanaan event-event Ramadhan Masjid Al-Akbar.",
   "sasaran": "Volunteer",
   "waktu": "Selama event Ramadhan 1448 H"
  },
  {
   "d": "ek",
   "n": "Festival Remas",
   "desk": "Rangkaian kegiatan dalam rangka memperingati perjalanan Remaja Masjid.",
   "tujuan": "Memperingati dan merayakan perjalanan Remaja Masjid.",
   "sasaran": "Sasaran utama (rincian terpotong di dokumen)",
   "waktu": "Hari 1 — Grand Opening"
  },
  {
   "d": "ek",
   "n": "Kemitraan",
   "desk": "Media partner: menjalin dan mengelola kerja sama publikasi.",
   "tujuan": "Membangun relasi strategis dengan pihak internal dan eksternal.",
   "sasaran": "Pihak internal dan eksternal",
   "waktu": "Dilaksanakan selama 1 periode"
  },
  {
   "d": "oe",
   "n": "Ngaji Soccer",
   "desk": "Bergabung dalam program Masjid Al-Akbar “Ngaji Soccer”: ceramah singkat dan kegiatan olahraga.",
   "tujuan": "Meramaikan program serta meningkatkan kesadaran hidup sehat.",
   "sasaran": "Seluruh anggota Remas Al-Akbar Surabaya",
   "waktu": "Setiap Selasa malam, pukul 19:00 – selesai"
  },
  {
   "d": "oe",
   "n": "Remas Competition Series (RCS)",
   "desk": "Kompetisi olahraga dan e-sport (mini soccer dan Mobile Legends).",
   "tujuan": "Menyalurkan bakat, menciptakan kegiatan positif, aktif, dan sportif, serta memperkenalkan Remas Al-Akbar sebagai wadah positif bagi semua lapisan.",
   "sasaran": "Internal masjid dan eksternal",
   "waktu": "2 kali dalam 1 tahun"
  },
  {
   "d": "oe",
   "n": "Bugarin",
   "desk": "Agenda kesehatan berupa olahraga bersama yang sehat, menyenangkan, dan inklusif.",
   "tujuan": "Meningkatkan kesadaran masyarakat tentang olahraga sekaligus mempererat silaturahmi Remas dengan warga sekitar.",
   "sasaran": "Masyarakat sekitar yang biasa berolahraga di lingkungan Al-Akbar",
   "waktu": "Setiap 2 bulan sekali"
  }
 ]
};
const COL = {bph:'var(--c-bph)',dd:'var(--c-dd)',ek:'var(--c-ek)',oe:'var(--c-oe)'};
let cur='all', term='';
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Judul: huruf muncul bergantian (momen animasi utama)
(function(){const el=$('#ttl');let i=0;
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3){const f=document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(w=>{ if(/^\s+$/.test(w)||!w){f.append(w);return}
        const wd=document.createElement('span');wd.style.cssText='display:inline-block;opacity:1;transform:none;animation:none';
        [...w].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(.25+i++*.035)+'s';wd.append(s)});f.append(wd)});
      c.replaceWith(f)} else if(c.nodeType===1) walk(c)})};
  walk(el)})();

// Tabs
const tabs=$('#tabs'), pill=$('#pill');
const list=[{id:'all',nama:'Semua'},...DATA.divisi];
list.forEach(d=>{
  const n=d.id==='all'?DATA.program.length:DATA.program.filter(p=>p.d===d.id).length;
  const b=document.createElement('button');b.className='tab'+(d.id==='all'?' on':'');b.dataset.id=d.id;
  b.innerHTML=esc(d.nama)+'<i>'+n+'</i>';b.onclick=()=>{cur=d.id;setTab();render()};tabs.append(b)});
function setTab(){
  tabs.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.id===cur;t.classList.toggle('on',on);
    if(on){pill.style.width=t.offsetWidth+'px';pill.style.transform='translateX('+t.offsetLeft+'px)';t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}})}

// Render
function render(){
  const d=DATA.divisi.find(x=>x.id===cur);
  $('#intro').innerHTML = d ? '<h2>'+esc(d.nama)+'</h2>'+esc(d.ket) : '<h2>Semua program kerja</h2>Dari perekrutan kader sampai kompetisi olahraga.';
  const q=term.toLowerCase();
  const items=DATA.program.filter(p=>(cur==='all'||p.d===cur)&&(!q||(p.n+p.desk+p.tujuan+p.sasaran+p.waktu).toLowerCase().includes(q)));
  const g=$('#grid');
  g.innerHTML=items.length?items.map((p,i)=>{
    const dv=DATA.divisi.find(x=>x.id===p.d).nama;
    return '<article class="card" tabindex="0" role="button" aria-expanded="false" style="--c:'+COL[p.d]+';animation-delay:'+(i*55)+'ms">'
    +'<div class="dv">'+esc(dv)+'</div><h3>'+esc(p.n)+'</h3><p class="s">'+esc(p.desk)+'</p><span class="chev"></span>'
    +'<div class="more"><div>'
    +'<div class="row"><b>Tujuan</b>'+esc(p.tujuan)+'</div>'
    +'<div class="row"><b>Sasaran peserta</b>'+esc(p.sasaran)+'</div>'
    +'<div class="row"><b>Waktu</b>'+esc(p.waktu)+'</div></div></div>'
    +'<span class="time">'+esc(p.waktu.split(',')[0].split('(')[0])+'</span></article>'}).join('')
    :'<div class="empty"><h3>Tidak ada program yang cocok</h3><p>Coba kata kunci lain atau pilih tab Semua.</p></div>';
  g.querySelectorAll('.card').forEach(c=>{
    const t=()=>{const o=c.classList.toggle('open');c.setAttribute('aria-expanded',o)};
    c.onclick=t;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}})}

$('#q').addEventListener('input',e=>{term=e.target.value.trim();render()});

// Hitung naik
function count(el,to){let s=null;const f=t=>{s=s||t;const p=Math.min((t-s)/1200,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
setTimeout(()=>{count($('#s-prog'),DATA.program.length);count($('#s-div'),DATA.divisi.length)},1400);

// Scroll
addEventListener('scroll',()=>{const h=document.documentElement;
  $('#bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  $('#top').classList.toggle('show',h.scrollTop>500)});
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('resize',setTab);
document.fonts.ready.then(setTab);setTab();render();
</script>
</body>
</html>
